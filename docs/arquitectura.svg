<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .t{font-size:15px;font-weight:700;fill:#0f172a}
      .s{font-size:12px;fill:#334155}
      .x{font-size:11px;fill:#64748b}
      .n{font-size:13px;font-weight:700;fill:#fff}
      .l{stroke:#475569;stroke-width:1.8;fill:none;marker-end:url(#f)}
      .d{stroke:#94a3b8;stroke-width:1.5;fill:none;stroke-dasharray:5 4;marker-end:url(#f)}
    </style>
  </defs>
  <rect width="1400" height="800" fill="#ffffff"/>
  <text x="700" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Proyecto 2 · Arquitectura del datalake de ventas retail en AWS (todo creado con Terraform)</text>

  <!-- Columna 1: fuentes -->
  <rect x="20" y="60" width="250" height="560" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="145" y="86" text-anchor="middle" class="t">① ② Fuentes de datos</text>
  <rect x="40" y="105" width="210" height="140" rx="10" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="145" y="130" text-anchor="middle" class="t">RDS MariaDB</text>
  <text x="145" y="150" text-anchor="middle" class="s">retaildb (ERP, privada)</text>
  <text x="145" y="172" text-anchor="middle" class="x">customers · products · countries</text>
  <text x="145" y="192" text-anchor="middle" class="x">4.372 clientes · 3.958 productos</text>
  <text x="145" y="212" text-anchor="middle" class="x">38 países + región comercial</text>
  <rect x="40" y="265" width="210" height="150" rx="10" fill="#dcfce7" stroke="#22c55e"/>
  <text x="145" y="290" text-anchor="middle" class="t">EC2 fuente de archivos</text>
  <text x="145" y="310" text-anchor="middle" class="s">/srv/ventas (sistema de caja)</text>
  <text x="145" y="332" text-anchor="middle" class="x">13 CSV: ventas_2010_12 … 2011_12</text>
  <text x="145" y="352" text-anchor="middle" class="x">541.909 líneas de factura</text>
  <text x="145" y="372" text-anchor="middle" class="x">sin país ni descripción</text>
  <text x="145" y="398" text-anchor="middle" class="s" font-weight="700">cron cada 10 min: aws s3 sync</text>
  <rect x="40" y="435" width="210" height="165" rx="10" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="145" y="460" text-anchor="middle" class="t">URLs públicas</text>
  <text x="145" y="482" text-anchor="middle" class="s">api.frankfurter.dev</text>
  <text x="145" y="500" text-anchor="middle" class="x">tasas GBP→USD/EUR diarias</text>
  <text x="145" y="524" text-anchor="middle" class="s">api.worldbank.org</text>
  <text x="145" y="542" text-anchor="middle" class="x">población 2011 (SP.POP.TOTL)</text>
  <text x="145" y="560" text-anchor="middle" class="x">PIB per cápita (NY.GDP.PCAP.CD)</text>
  <text x="145" y="584" text-anchor="middle" class="x">JSON</text>

  <!-- Columna 2: ingesta -->
  <rect x="300" y="60" width="200" height="560" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="400" y="86" text-anchor="middle" class="t">③ Ingesta automática</text>
  <rect x="315" y="105" width="170" height="80" rx="10" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="400" y="130" text-anchor="middle" class="t">Glue job</text>
  <text x="400" y="150" text-anchor="middle" class="s">ingesta-rds (Spark)</text>
  <text x="400" y="170" text-anchor="middle" class="x">Glue Connection JDBC</text>
  <rect x="315" y="300" width="170" height="80" rx="10" fill="#dcfce7" stroke="#22c55e"/>
  <text x="400" y="325" text-anchor="middle" class="t">cron en la EC2</text>
  <text x="400" y="345" text-anchor="middle" class="s">sincronizar_ventas_s3.sh</text>
  <text x="400" y="365" text-anchor="middle" class="x">LabInstanceProfile</text>
  <rect x="315" y="475" width="170" height="80" rx="10" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="400" y="500" text-anchor="middle" class="t">Glue job</text>
  <text x="400" y="520" text-anchor="middle" class="s">ingesta-url (Python shell)</text>
  <text x="400" y="540" text-anchor="middle" class="x">3 descargas con reintentos</text>
  <path class="l" d="M250 175 H313"/>
  <path class="l" d="M250 340 H313"/>
  <path class="l" d="M250 515 H313"/>
  <rect x="315" y="200" width="170" height="80" rx="10" fill="#fdf4ff" stroke="#c026d3" stroke-dasharray="5 3"/>
  <text x="400" y="222" text-anchor="middle" class="s" font-weight="700">Glue Workflow</text>
  <text x="400" y="240" text-anchor="middle" class="x">diario 6:00 a.m. o a mano</text>
  <text x="400" y="258" text-anchor="middle" class="x">ingestas → trusted →</text>
  <text x="400" y="272" text-anchor="middle" class="x">refined → crawlers</text>

  <!-- Columna 3: datalake -->
  <rect x="530" y="60" width="360" height="560" rx="14" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/>
  <text x="710" y="86" text-anchor="middle" class="t">Datalake Amazon S3 (un bucket, 3 zonas)</text>
  <rect x="550" y="105" width="320" height="140" rx="10" fill="#e2e8f0" stroke="#64748b"/>
  <text x="710" y="130" text-anchor="middle" class="t">raw/ (bronze) · CSV y JSON originales</text>
  <text x="565" y="155" class="x">rds/&lt;tabla&gt;/fecha_ingesta=AAAA-MM-DD/part.csv</text>
  <text x="565" y="175" class="x">ec2/ventas/ventas_AAAA_MM.csv</text>
  <text x="565" y="195" class="x">url/&lt;fuente&gt;/fecha_ingesta=AAAA-MM-DD/&lt;fuente&gt;.json</text>
  <text x="565" y="222" class="s">inmutable · histórico por fecha de ingesta</text>
  <path class="l" d="M485 145 H548"/>
  <path class="l" d="M485 340 C520 340 520 200 548 200"/>
  <path class="l" d="M485 515 C525 515 525 225 548 225"/>
  <rect x="550" y="290" width="320" height="140" rx="10" fill="#cffafe" stroke="#0891b2"/>
  <text x="710" y="315" text-anchor="middle" class="t">trusted/ (silver) · Parquet</text>
  <text x="565" y="340" class="x">ventas/anio=/mes=/ (399.654 filas limpias)</text>
  <text x="565" y="360" class="x">clientes · productos · paises · tasas_cambio</text>
  <text x="565" y="380" class="x">_reportes/calidad_ventas.json (7 reglas)</text>
  <text x="565" y="410" class="s">nombres en español · tipos · sin duplicados</text>
  <path class="l" d="M710 245 V288"/>
  <text x="720" y="272" class="s" font-weight="700">④ Glue job raw-a-trusted</text>
  <rect x="550" y="475" width="320" height="125" rx="10" fill="#d1fae5" stroke="#059669"/>
  <text x="710" y="500" text-anchor="middle" class="t">refined/ (gold) · Parquet</text>
  <text x="565" y="525" class="x">p1_top_paises_ingreso_usd · p2_ingreso_mensual</text>
  <text x="565" y="545" class="x">p3_top_productos · p4_gasto_por_habitante</text>
  <text x="565" y="565" class="x">p5_devoluciones_por_region · p6_ventas_dia_hora</text>
  <text x="565" y="588" class="s">una tabla por pregunta de negocio</text>
  <path class="l" d="M710 430 V473"/>
  <text x="720" y="457" class="s" font-weight="700">⑦ PySpark (Glue o EMR)</text>

  <!-- Columna 4: catálogo y consulta -->
  <rect x="920" y="60" width="210" height="560" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="1025" y="86" text-anchor="middle" class="t">⑤ Catálogo · ⑥ ⑦ SQL/Spark</text>
  <rect x="935" y="105" width="180" height="120" rx="10" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="1025" y="128" text-anchor="middle" class="t">Glue Data Catalog</text>
  <text x="1025" y="148" text-anchor="middle" class="x">3 crawlers</text>
  <text x="1025" y="166" text-anchor="middle" class="x">retail_raw · retail_trusted</text>
  <text x="1025" y="184" text-anchor="middle" class="x">retail_refined</text>
  <text x="1025" y="206" text-anchor="middle" class="x">+ retail_hive (creada en Hive)</text>
  <rect x="935" y="250" width="180" height="90" rx="10" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="1025" y="275" text-anchor="middle" class="t">Amazon Athena</text>
  <text x="1025" y="295" text-anchor="middle" class="x">workgroup retail-p2-wg</text>
  <text x="1025" y="313" text-anchor="middle" class="x">6 Saved queries (SQL)</text>
  <rect x="935" y="365" width="180" height="150" rx="10" fill="#ffedd5" stroke="#ea580c"/>
  <text x="1025" y="390" text-anchor="middle" class="t">Amazon EMR 7.10</text>
  <text x="1025" y="410" text-anchor="middle" class="x">Hive: crear tablas + 6 SQL</text>
  <text x="1025" y="428" text-anchor="middle" class="x">SparkSQL: mismas 6 SQL</text>
  <text x="1025" y="446" text-anchor="middle" class="x">PySpark: analitica_pyspark</text>
  <text x="1025" y="464" text-anchor="middle" class="x">Hue :8888 · JupyterHub :9443</text>
  <text x="1025" y="490" text-anchor="middle" class="s">metastore = Glue Catalog</text>
  <path class="d" d="M870 360 H933"/>
  <path class="d" d="M1025 225 V248"/>
  <path class="d" d="M1025 340 V363"/>
  <text x="935" y="545" class="x">Las mismas 6 consultas SQL corren</text>
  <text x="935" y="561" class="x">en Athena, Hive y SparkSQL y dan</text>
  <text x="935" y="577" class="x">igual que PySpark (validación</text>
  <text x="935" y="593" class="x">cruzada entre 4 motores).</text>

  <!-- Columna 5: consumo -->
  <rect x="1160" y="60" width="220" height="560" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="1270" y="86" text-anchor="middle" class="t">⑧ Visualización y API</text>
  <rect x="1175" y="105" width="190" height="90" rx="10" fill="#fce7f3" stroke="#db2777"/>
  <text x="1270" y="130" text-anchor="middle" class="t">API Gateway</text>
  <text x="1270" y="150" text-anchor="middle" class="x">GET /salud · /preguntas</text>
  <text x="1270" y="168" text-anchor="middle" class="x">GET /preguntas/{p1..p6}</text>
  <rect x="1175" y="220" width="190" height="80" rx="10" fill="#fce7f3" stroke="#db2777"/>
  <text x="1270" y="245" text-anchor="middle" class="t">AWS Lambda</text>
  <text x="1270" y="265" text-anchor="middle" class="x">consulta Athena (refined)</text>
  <text x="1270" y="283" text-anchor="middle" class="x">responde JSON</text>
  <path class="l" d="M1270 195 V218"/>
  <path class="l" d="M1175 270 C1150 270 1150 300 1117 300"/>
  <rect x="1175" y="340" width="190" height="95" rx="10" fill="#e0e7ff" stroke="#4f46e5"/>
  <text x="1270" y="365" text-anchor="middle" class="t">Streamlit (EC2)</text>
  <text x="1270" y="385" text-anchor="middle" class="x">tablero :8501</text>
  <text x="1270" y="403" text-anchor="middle" class="x">gráfica, tabla y</text>
  <text x="1270" y="421" text-anchor="middle" class="x">respuesta en una frase</text>
  <rect x="1175" y="455" width="190" height="80" rx="10" fill="#e0e7ff" stroke="#4f46e5"/>
  <text x="1270" y="480" text-anchor="middle" class="t">matplotlib</text>
  <text x="1270" y="500" text-anchor="middle" class="x">generar_graficas.py</text>
  <text x="1270" y="518" text-anchor="middle" class="x">6 PNG + tablero.png</text>
  <path class="l" d="M1200 340 V197"/>
  <path class="l" d="M1340 455 V197"/>

  <!-- Pie -->
  <rect x="20" y="640" width="1360" height="140" rx="14" fill="#0f172a"/>
  <text x="40" y="670" class="n">Infraestructura como código: infra/*.tf (Terraform 1.9, AWS provider 5) · Rol LabRole / LabInstanceProfile de AWS Academy (no se crean roles IAM)</text>
  <text x="40" y="696" fill="#cbd5e1" font-size="12.5">Red: VPC por defecto · RDS privado (solo Glue y la EC2 fuente entran al 3306) · Endpoint S3 gateway para los jobs de Glue en la VPC · Hue/JupyterHub/SSH solo desde la IP del equipo</text>
  <text x="40" y="720" fill="#cbd5e1" font-size="12.5">Seguridad: bucket privado y cifrado (SSE-S3) · clave del RDS generada por Terraform y guardada solo en la Glue Connection y en la EC2 · IMDSv2 en las EC2 · sin llaves AWS en el código</text>
  <text x="40" y="744" fill="#cbd5e1" font-size="12.5">Costos: EMR solo existe con crear_emr = true y se apaga solo tras 2 h sin trabajo · terraform destroy (scripts/limpiar.sh) borra todo, incluido el contenido del bucket</text>
  <text x="40" y="768" fill="#94a3b8" font-size="12">Dataset: Online Retail (UCI Machine Learning Repository, CC BY 4.0) · dic-2010 a dic-2011 · tienda online del Reino Unido · 541.909 líneas</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
